<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diario de Fuerza · Volumen</title>
<meta name="theme-color" content="#0e1011">
<meta name="description" content="Diario de entrenamiento Full Body: pesos, progreso, calorías, actividad y peso corporal.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#0e1011;--card:#16191b;--card2:#1c2023;--line:#272c2f;
  --text:#eef0ea;--muted:#8d9491;--acc:#c8f53a;--acc-ink:#141a02;
  --warm:#ff8a3d;--ok:#5fd38d;--bad:#ff6b6b;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px 110px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:34px;letter-spacing:.5px;margin:0;line-height:1;text-transform:uppercase}
h1 span{color:var(--acc)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
#status{display:none!important}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#2b4a37}.chip.bad{color:var(--bad);border-color:#5a2a2a}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 0 10px;margin-bottom:6px}
@media (max-width:560px){nav{grid-template-columns:repeat(3,1fr)}}
nav button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-family:"Barlow Condensed";font-weight:600;font-size:15px;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;color:var(--muted)}
nav button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=date],input[type=number],input[type=text],input[type=search],select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=search]{-webkit-appearance:none;appearance:none;font-size:16px}
textarea{width:100%;min-height:64px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.seg button.on{border-color:var(--acc);color:var(--acc)}
.enfoque{font-family:"Barlow Condensed";font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin:4px 0 10px;color:var(--muted)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-weight:600;font-size:18px}
.tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.leg{color:var(--warm)}
.target{font-family:"Barlow Condensed";font-size:17px;color:var(--acc);white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:6px 0 10px}
.hint b{color:var(--text);font-weight:600}
.sug{color:var(--acc)}
.sets{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px 8px;align-items:center}
.sets .lbl{font-size:12px;color:var(--muted);text-transform:uppercase}
.sets .s{font-family:"Barlow Condensed";font-size:18px;color:var(--muted)}
.sets input{width:100%;text-align:center;font-size:18px;padding:9px 6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:#3a4044}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600;font-size:16px;padding:11px 16px}
.btn.big{font-size:17px;padding:13px 16px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#1a0505;border-color:var(--bad)}
.full{width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-family:"Barlow Condensed";font-weight:700;font-size:30px;line-height:1.1;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--bad)}
.chart-box{position:relative;height:250px}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.hist-ex{font-size:14px;margin:3px 0;color:var(--muted)}
.hist-ex b{color:var(--text);font-weight:500}
.h2{font-family:"Barlow Condensed";font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.4px;margin:0 0 10px}
.note{font-size:13px;color:var(--muted)}
.banner{background:#2a2112;border:1px solid #5a4220;color:#ffcf9a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner.good{background:#14261b;border-color:#2b4a37;color:#a9e9c2}
.banner.bad{background:#2a1414;border-color:#5a2a2a;color:#ffb3b3}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar > i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.p > i{background:#7cc6ff}
.bal{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;text-align:center;margin:4px 0 12px}
.bal .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.bal .v{font-family:"Barlow Condensed";font-weight:700;font-size:28px;line-height:1.1}
.bal .op{font-family:"Barlow Condensed";font-size:24px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;margin:0 6px 6px 0}
.pill:hover{border-color:var(--acc)}
.pill small{color:var(--muted)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.li:last-child{border-bottom:0}
.li .m{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ed-ex{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.ed-ex input,.ed-ex select{background:var(--bg)}
.ed-nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.ed-nums input{width:100%;text-align:center;padding:8px 4px}
@media (max-width:480px){.ed-nums{grid-template-columns:repeat(3,1fr)}}
.ed-top{display:grid;grid-template-columns:1fr 120px auto;gap:6px;align-items:center}
.ed-top input{width:100%}
.mini{display:flex;gap:4px}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:20;background:#0b0d0e;border:1px solid var(--acc);border-radius:16px;padding:10px 12px 10px 18px;display:none;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);width:min(94vw,420px)}
#timer.show{display:flex}
#timer .t{font-family:"Barlow Condensed";font-weight:700;font-size:36px;color:var(--acc);min-width:84px;font-variant-numeric:tabular-nums}
#timer .lab{flex:1;font-size:13px;color:var(--muted);line-height:1.2}
#timer.done{border-color:var(--warm)}#timer.done .t{color:var(--warm)}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
#login.show{display:block}
.lg-box{max-width:420px;margin:0 auto;padding:64px 22px 40px}
.lg-logo{font-family:"Barlow Condensed";font-weight:700;font-size:44px;text-transform:uppercase;line-height:1;text-align:center}
.lg-logo span{color:var(--acc)}
.lg-sub{text-align:center;color:var(--muted);margin:8px 0 28px}
.lg-box label{margin-bottom:12px}
.lg-box input{width:100%;font-size:17px;padding:13px 14px;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);outline:none}
.lg-box input:focus{border-color:var(--acc)}
.lg-link{background:none;border:0;color:var(--acc);cursor:pointer;font-size:15px;padding:8px 0;text-decoration:underline}
.lg-msg{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.lg-msg.err{background:#2a1414;border:1px solid #5a2a2a;color:#ffb3b3}.lg-msg.ok{background:#14261b;border:1px solid #2b4a37;color:#a9e9c2}
#wizard{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:none}
#wizard.show{display:block}
.wz-box{max-width:560px;margin:0 auto;padding:24px 18px 40px}
.wz-steps{display:flex;gap:6px;margin-bottom:22px}.wz-steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.wz-steps i.on{background:var(--acc)}
.wz-title{font-family:"Barlow Condensed";font-weight:700;font-size:34px;text-transform:uppercase;line-height:1.05;margin:0 0 8px}
.wz-opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.wz-opt b{display:block;font-size:17px;margin-bottom:2px}.wz-opt span{color:var(--muted);font-size:14px}
.wz-opt.on{border-color:var(--acc);background:#1b2112}
.wz-nav{display:flex;gap:10px;margin-top:22px}.wz-nav .btn{flex:1}
.wz-box input[type=text],.wz-box input[type=number]{width:100%}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;display:none;max-width:92vw;text-align:center}
#toast.err{background:var(--bad);color:#1a0505}
.editing{border-color:var(--warm)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Diario de <span>Fuerza</span></h1>
      <div class="sub" id="sub">Full Body · L / X / V · Fase de volumen</div>
    </div>
    <div id="status" class="chip">Cargando…</div>
  </header>
  <nav>
    <button data-tab="entrenar" class="on">Entrenar</button>
    <button data-tab="calorias">Calorías</button>
    <button data-tab="progreso">Progreso</button>
    <button data-tab="peso">Peso</button>
    <button data-tab="historial">Historial</button>
    <button data-tab="ajustes">Ajustes</button>
  </nav>
  <div id="banner"></div>
  <section id="tab-entrenar"></section>
  <section id="tab-calorias" class="hidden"></section>
  <section id="tab-progreso" class="hidden"></section>
  <section id="tab-peso" class="hidden"></section>
  <section id="tab-historial" class="hidden"></section>
  <section id="tab-ajustes" class="hidden"></section>
</div>

<div id="timer">
  <div class="t" id="timer-t">0:00</div>
  <div class="lab" id="timer-lab">Descanso</div>
  <button class="btn" id="timer-plus">+15 s</button>
  <button class="btn" id="timer-stop">Parar</button>
</div>
<div id="toast"></div>
<div id="wizard" aria-modal="true" role="dialog"><div class="wz-box" id="wz-box"></div></div>
<div id="login" aria-modal="true" role="dialog"><div class="lg-box" id="lg-box"></div></div>

<script>
/* =====================================================================
   DATOS POR DEFECTO
   ===================================================================== */
const SEMANA = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const WD = {"Domingo":0,"Lunes":1,"Martes":2,"Miércoles":3,"Jueves":4,"Viernes":5,"Sábado":6};
const INI = {"Lunes":"L","Martes":"M","Miércoles":"X","Jueves":"J","Viernes":"V","Sábado":"S","Domingo":"D"};
function diasDe(r){ return SEMANA.filter(d=>r&&r[d]); }
let DIAS = ["Lunes","Miércoles","Viernes"]; // días de la rutina activa (se actualiza con syncDias)
function syncDias(){ DIAS=diasDe(D.rutina); if(!DIAS.length){ D.rutina=clone(DEFAULT_RUTINA); DIAS=diasDe(D.rutina); } }
const MUSCULOS = ["Pierna","Glúteo","Pecho","Espalda","Hombro","Bíceps","Tríceps","Core","Cardio","Otro"];
const PIERNA = ["Pierna","Glúteo"];
/* ---------- Catálogo de ejercicios (el mismo id = el mismo historial en todas las rutinas) ---------- */
const CATALOGO = {
  W1:{nombre:"Hip thrust con barra",musculo:"Glúteo",tip:"Espalda apoyada en el banco y la barra sobre la cadera (con almohadilla). Empuja con los talones y aprieta el glúteo arriba 1 segundo."},
  W2:{nombre:"Sentadilla goblet con mancuerna",musculo:"Pierna",tip:"Mancuerna pegada al pecho, pies algo más abiertos que la cadera. Baja como si te sentaras, con la espalda recta y las rodillas hacia fuera."},
  W19:{nombre:"Face pull en polea",musculo:"Hombro",tip:"Polea a la altura de la cara, con cuerda. Tira hacia la frente abriendo los codos hacia fuera y junta los omóplatos. Trabaja la parte de atrás del hombro y la espalda alta, y mejora la postura."},
  E8:{nombre:"Jalón al pecho en polea",musculo:"Espalda",tip:"Agarre algo más ancho que los hombros. Saca pecho y lleva la barra a la parte alta del pecho sin balancearte."},
  E16:{nombre:"Elevaciones laterales con mancuernas",musculo:"Hombro",tip:"Codos un poco doblados, sube hasta la altura de los hombros. Peso ligero y sin impulso."},
  W6:{nombre:"Plancha frontal",musculo:"Core",unidad:"s",tip:"Antebrazos en el suelo y el cuerpo recto de la cabeza a los talones. Aprieta abdomen y glúteos. Apunta los segundos que aguantas."},
  W7:{nombre:"Peso muerto rumano con mancuernas",musculo:"Pierna",tip:"Rodillas un poco flexionadas. Lleva la cadera hacia atrás bajando las mancuernas pegadas a las piernas hasta notar que estira la parte de atrás del muslo. Espalda recta."},
  W8:{nombre:"Abducción de cadera en máquina",musculo:"Glúteo",tip:"Abre las piernas hacia fuera de forma controlada. Inclinarte un poco hacia delante trabaja más el glúteo."},
  E10:{nombre:"Remo sentado en polea baja",musculo:"Espalda",tip:"Espalda recta. Tira del agarre hacia el ombligo juntando los omóplatos y vuelve despacio."},
  E4:{nombre:"Press de hombro con mancuernas sentada",musculo:"Hombro",tip:"Sentada con respaldo. Empuja las mancuernas desde la altura de las orejas hacia arriba sin arquear la espalda."},
  E12:{nombre:"Curl de bíceps con mancuernas",musculo:"Bíceps",tip:"Codos pegados al cuerpo. Sube sin balancearte y baja despacio."},
  W12:{nombre:"Elevaciones de piernas tumbada",musculo:"Core",tip:"Boca arriba, manos bajo los glúteos. Sube las piernas rectas hasta 90° y baja sin tocar el suelo."},
  E13:{nombre:"Prensa de piernas con los pies altos",musculo:"Pierna",tip:"Pies altos y separados en la plataforma (así trabaja más el glúteo). Baja hasta 90° sin despegar la zona lumbar del respaldo."},
  W14:{nombre:"Patada de glúteo en polea",musculo:"Glúteo",tip:"Tobillera en la polea baja. Lleva la pierna hacia atrás apretando el glúteo, sin arquear la espalda. Las repeticiones son por pierna."},
  E15:{nombre:"Remo con mancuerna a una mano",musculo:"Espalda",tip:"Rodilla y mano apoyadas en el banco. Tira de la mancuerna hacia la cadera con la espalda recta. Repeticiones por brazo."},
  E9:{nombre:"Press inclinado con mancuernas",musculo:"Pecho",tip:"Banco inclinado a unos 30°. Baja las mancuernas a la parte alta del pecho y empuja. Trabaja pecho, hombros y tríceps a la vez."},
  E6:{nombre:"Extensión de tríceps en polea alta",musculo:"Tríceps",tip:"Codos pegados a los costados. Estira los brazos hacia abajo y vuelve controlando."},
  W18:{nombre:"Crunch en polea alta de rodillas",musculo:"Core",tip:"De rodillas frente a la polea, con la cuerda junto a la cabeza. Enrolla el tronco hacia abajo apretando el abdomen."},
  P1:{nombre:"Zancadas con mancuernas",musculo:"Pierna",tip:"Da un paso largo y baja hasta que la rodilla de atrás casi toque el suelo, con el tronco recto. Repeticiones por pierna."},
  P3:{nombre:"Aperturas en polea (cruce)",musculo:"Pecho",tip:"Brazos casi estirados, junta las manos delante del pecho dibujando un arco y vuelve despacio."},
  B1:{nombre:"Dominadas asistidas (máquina o goma)",musculo:"Espalda",tip:"Agarre algo más ancho que los hombros. Sube hasta que la barbilla pase la barra y baja controlando. Con más ayuda si hace falta."},
  H1:{nombre:"Pájaros con mancuernas",musculo:"Hombro",tip:"Tronco inclinado hacia delante y espalda recta. Abre los brazos hacia los lados hasta la altura de los hombros. Trabaja la parte de atrás del hombro."},
  T1:{nombre:"Fondos de tríceps en banco",musculo:"Tríceps",tip:"Manos en el borde del banco detrás de ti. Baja doblando los codos hacia atrás hasta 90° y sube."},
  K1:{nombre:"Plancha lateral",musculo:"Core",unidad:"s",tip:"Apoyada en un antebrazo, cuerpo recto de lado. Aguanta los segundos indicados con cada lado."},
  // Cardio (se apunta en minutos; en "nivel" la inclinación, velocidad o resistencia)
  C1:{nombre:"Cinta inclinada caminando",musculo:"Cardio",unidad:"min",tip:"Camina a 5–6 km/h con inclinación del 6 al 10 %. Debes poder hablar con frases cortas. Sin agarrarte a la barra. En «nivel» apunta la inclinación."},
  C2:{nombre:"Bicicleta estática",musculo:"Cardio",unidad:"min",tip:"Ritmo moderado y constante: sudas y respiras más rápido, pero puedes hablar. En «nivel» apunta la resistencia."},
  C3:{nombre:"Elíptica",musculo:"Cardio",unidad:"min",tip:"Ritmo moderado y constante, espalda recta. En «nivel» apunta la resistencia."},
  // Rutina clásica (la primera versión)
  E1:{nombre:"Sentadillas con barra",musculo:"Pierna",tip:"Barra sobre la parte alta de la espalda, pies a la anchura de los hombros. Baja con la espalda recta hasta que los muslos queden paralelos al suelo."},
  E2:{nombre:"Press de banca con barra",musculo:"Pecho",tip:"Tumbada, agarre algo más ancho que los hombros. Baja la barra al pecho controlando y empuja sin despegar la espalda del banco."},
  E3:{nombre:"Remo con barra",musculo:"Espalda",tip:"Inclina el tronco hacia delante con la espalda recta y tira de la barra hacia el ombligo."},
  E5:{nombre:"Extensión de cuádriceps en máquina",musculo:"Pierna",tip:"Estira las piernas por completo apretando el muslo y baja despacio."},
  E7:{nombre:"Peso muerto rumano con barra",musculo:"Pierna",tip:"Rodillas un poco flexionadas, baja la barra pegada a las piernas llevando la cadera atrás. Espalda recta."},
  E11:{nombre:"Curl femoral tumbado en máquina",musculo:"Pierna",tip:"Lleva los talones hacia los glúteos sin levantar la cadera y baja despacio."},
  E14:{nombre:"Press de banca plano con mancuernas",musculo:"Pecho",tip:"Tumbada en banco plano. Baja las mancuernas despacio a los lados del pecho y empuja hacia arriba."},
  E17:{nombre:"Elevación de gemelos de pie en máquina",musculo:"Pierna",tip:"Sube sobre las puntas lo más alto que puedas, aguanta 1 segundo y baja estirando bien."},
  E18:{nombre:"Curl martillo con mancuernas",musculo:"Bíceps",tip:"Palmas mirándose entre sí, codos pegados al cuerpo. Sube y baja sin balanceo."},
  E19:{nombre:"Press francés con barra Z",musculo:"Tríceps",tip:"Tumbada, baja la barra hacia la frente doblando solo los codos y vuelve a estirar."}
};
// [id, series, reps (o segundos/minutos), descanso s, RIR, cuánto subir]

const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const FOODS=FOODS_RAW.map(([n,k,p,por,al],i)=>({id:"a"+i,n,k,p,por:por.split("|").map(x=>{const j=x.lastIndexOf(":"); return {l:x.slice(0,j),g:+x.slice(j+1)};}),s:norm(n+" "+(al||""))}));
function buscarAlimentos(q){
  const w=norm(q).trim().split(/\s+/).filter(Boolean); if(!w.length) return [];
  return FOODS.filter(f=>w.every(x=>f.s.includes(x)))
    .sort((a,b)=>(norm(a.n).startsWith(w[0])?0:1)-(norm(b.n).startsWith(w[0])?0:1)||(+a.id.slice(1))-(+b.id.slice(1))).slice(0,12);
}

function parseNumES(s){
  s=String(s??"").trim().replace(/[^\d.,-]/g,""); if(!s) return null;
  if(s.includes(",")&&s.includes(".")) s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(",")) s=s.replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const n=parseFloat(s); return isFinite(n)?n:null;
}
function addDays(f,n){ const d=new Date(f+"T12:00"); d.setDate(d.getDate()+n); return d.toLocaleDateString("sv"); }
function weekStart(f){ const d=new Date(f+"T12:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.toLocaleDateString("sv"); }

const KEY="diarioFuerza.v2";

function emptyData(){ return {v:2,rutinaVer:RUTINA_VER,rutina:clone(DEFAULT_RUTINA),perfil:clone(DEFAULT_PERFIL),sesiones:[],pesos:[],medidas:[],dias:{},favoritos:[],archivo:{},ultimaDescarga:"",plantilla:"ganar",onboarded:false}; }
function normalize(d){
  const e=emptyData();
  const ver=d.rutinaVer||0, onb=d.onboarded===undefined?true:!!d.onboarded; // quien ya usaba la app no ve el cuestionario
  d={...e,...d};
  d.onboarded=onb;
  d.rutinaVer=ver;
  d.perfil={...e.perfil,...(d.perfil||{})};
  if(!d.rutina||!diasDe(d.rutina).length) d.rutina=clone(DEFAULT_RUTINA);
  if(!Array.isArray(d.sesiones)) d.sesiones=[];
  if(!Array.isArray(d.pesos)) d.pesos=[];
  if(!Array.isArray(d.medidas)) d.medidas=[];
  if(!Array.isArray(d.favoritos)) d.favoritos=[];
  d.dias=d.dias||{}; d.archivo=d.archivo||{};
  return d;
}
function loadData(){
  const v2=lsGet(KEY);
  if(v2) return normalize(v2);
  const d=emptyData();
  const v1=lsGet("diarioFuerza.v1"); // versión anterior de la app
  if(v1){ d.rutinaVer=0; d.onboarded=true; d.favoritos=clone(DEFAULT_FAVS); d.sesiones=v1.sessions||[]; d.pesos=v1.weights||[]; }

}
function persist(silencioso){
  if(!silencioso) D.modificado=Date.now();
  if(!lsSet(KEY,D)){ toast("No se pudo guardar en este navegador",true); return false; }

}

/* Rutina activa + ejercicios archivados (para no perder nombres en el historial) */
function EX(){
  const m={};
  Object.entries(D.archivo).forEach(([id,e])=>m[id]={...e,id,dia:null,archivado:true});
  DIAS.forEach(d=>D.rutina[d].ejercicios.forEach(e=>m[e.id]={...e,dia:d}));
  return m;
}
function sortedSessions(){ return [...D.sesiones].sort((a,b)=>(a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.creado||0)-(b.creado||0))); }
function lastFor(exId, excludeId){
  const list=sortedSessions().filter(s=>s.id!==excludeId && s.sets && Array.isArray(s.sets[exId]) && s.sets[exId].length);
  return list.length ? {fecha:list[list.length-1].fecha, sets:list[list.length-1].sets[exId]} : null;
}
function suggestion(ex,last){
  if(!last) return null;
  const top=Math.max(...last.sets.map(s=>s.kg||0));
  const allHit=last.sets.length>=ex.series && last.sets.every(s=>(s.reps||0)>=ex.reps);
  if(ex.unidad==="min") return {kg:top, txt:allHit?`Hecho: ${ex.reps} minutos. Si te resultó fácil, sube un poco el nivel (inclinación o resistencia).`:`Objetivo: ${ex.reps} minutos a ritmo moderado.`};
  if(allHit&&!(+ex.inc)) return {kg:top, txt:`Lo completaste todo: la próxima vez intenta ${ex.reps+(ex.unidad==="s"?10:2)}${ex.unidad==="s"?" segundos":" repeticiones"}. Cuando lo consigas, cambia el objetivo en Ajustes.`};
  return allHit ? {kg:r1(top+(+ex.inc||0)), txt:`Lo completaste todo: sube a ${fmtKg(r1(top+(+ex.inc||0)))} kg`}
                : {kg:top, txt:`Mantén ${fmtKg(top)} kg hasta completar ${ex.series}×${ex.reps}`};
}

function saveForm(){
  if(!form.fecha){ toast("Pon la fecha",true); return; }
  const sets={}; let n=0;
  for(const [id,arr] of Object.entries(form.sets)){
    const clean=arr.map(s=>({kg:num(s.kg)??0,reps:num(s.reps)})).filter(s=>s.reps!=null&&s.reps>0).map(s=>({kg:s.kg,reps:Math.round(s.reps)}));
    if(clean.length){ sets[id]=clean; n+=clean.length; }
  }
  if(!n){ toast("Apunta al menos una serie (reps)",true); return; }
  const orig=form.id?D.sesiones.find(s=>s.id===form.id):null;
  const id=form.id||uid("s");
  D.sesiones=D.sesiones.filter(s=>s.id!==id);
  D.sesiones.push({id,fecha:form.fecha,dia:form.dia,sets,notas:form.notas||"",creado:orig?.creado||Date.now()});
  if(!persist()) return;
  toast(form.id?"Sesión actualizada":"Sesión guardada 💪");

/* =====================================================================
   AVISOS AUTOMÁTICOS (se recalculan cada vez que abres la app)
   ===================================================================== */
function coachTips(){
  const tips=[], p=D.perfil, today=hoy(), now=new Date(), hora=now.getHours()+now.getMinutes()/60;
  const ses=sortedSessions(), map={}; DIAS.forEach(d=>map[WD[d]]=d);
  // 1. Entreno de hoy y de la semana
  const diaHoy=map[now.getDay()];
  const hoyHecho=ses.some(s=>s.fecha===today);
  if(diaHoy&&!hoyHecho) tips.push({t:"info",h:`🏋️ Hoy toca <b>${esc(D.rutina[diaHoy].enfoque.charAt(0).toLowerCase()+D.rutina[diaHoy].enfoque.slice(1))}</b>. ¡A por ello!`});
  if(hoyHecho) tips.push({t:"good",h:"✅ Entreno de hoy registrado. ¡Bien hecho!"});
  const wk=weekStart(today); let previstos=0;
  for(let i=0;i<daysBetween(wk,today);i++){ const d=new Date(addDays(wk,i)+"T12:00").getDay(); if(map[d]) previstos++; }
  const hechos=ses.filter(s=>weekStart(s.fecha)===wk&&s.fecha<today).length;
  if(previstos>0&&hechos<previstos&&ses.length&&ses[0].fecha<wk) tips.push({t:"warn",h:`Esta semana llevas <b>${hechos} de ${previstos}</b> entrenos previstos hasta hoy. Si te saltaste uno, puedes recuperarlo otro día: no hace falta que sea L/X/V exacto.`});
  // 2. Comida según la hora (solo hoy)
  const c=calc(today), totalPlan=PLAN_HORAS.reduce((a,[id])=>a+((D.favoritos.find(f=>f.id===id)||DEFAULT_FAVS.find(f=>f.id===id)).kcal),0);
  let acum=0, sig=null;
  for(const [id,hh] of PLAN_HORAS){ const f=D.favoritos.find(x=>x.id===id)||DEFAULT_FAVS.find(x=>x.id===id); if(hh+1<=hora) acum+=f.kcal; else if(!sig) sig={f,hh}; }
  const esperado=Math.round((+p.objKcal||2400)*acum/totalPlan);
  if(esperado>0&&c.comido<esperado-250){
    const hhmm=`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    const toca=sig?sig.f:null;
    tips.push({t:"warn",h:`🍽️ Son las ${hhmm} y llevas <b>${fmtK(c.comido)} kcal</b>; según tu plan irías por unas ${fmtK(esperado)}. Si ya has comido, apúntalo en Calorías.`,btn:toca&&D.favoritos.some(f=>f.id===toca.id)?{attr:`data-addfavnow="${toca.id}"`,txt:`＋ Apuntar ${toca.nombre.split(":")[0]} (${fmtK(toca.kcal)} kcal)`}:{attr:'data-go="calorias"',txt:"Ir a Calorías"}});
  }
  // 3. Balance de ayer
  if(perfilOK()){
    const ay=calc(addDays(today,-1)), dAy=dia(addDays(today,-1));
    const k=objKey(), est=balEstado(ay.balance);
    if(dAy.comidas.length&&k==="perder"&&ay.comido<kcalMinSegura(ay.kg)) tips.push({t:"bad",h:`Ayer comiste solo <b>${fmtK(ay.comido)} kcal</b>, por debajo del mínimo recomendado (${fmtK(kcalMinSegura(ay.kg))}). Comer tan poco hace perder músculo: hoy come un poco más.`});
    else if(dAy.comidas.length&&est==="bajo"){
      if(k==="ganar") tips.push({t:"bad",h:ay.balance<0?`Ayer gastaste <b>${fmtK(-ay.balance)} kcal</b> más de lo que comiste. Hoy intenta añadir un extra, por ejemplo un batido.`:`Ayer te quedaste <b>${fmtK((+p.superavit||0)-ay.balance)} kcal</b> por debajo de tu superávit mínimo. Hoy intenta añadir un extra.`});
      else if(k==="recomp") tips.push({t:"warn",h:`Ayer comiste <b>${fmtK(-ay.balance)} kcal</b> menos de lo que gastaste. Para tonificar conviene comer más o menos lo mismo que gastas.`});
      else tips.push({t:"warn",h:`Ayer el déficit fue muy grande (<b>${fmtK(-ay.balance)} kcal</b>). Mejor un déficit moderado y constante: pierdes grasa sin perder músculo.`});
    } else if(dAy.comidas.length&&est==="alto"&&k==="perder") tips.push({t:"info",h:`Ayer no hubo déficit (${ay.balance>0?"+":""}${fmtK(ay.balance)} kcal). No pasa nada por un día: hoy vuelve a tu plan.`});
  } else tips.push({t:"info",h:"Completa tu perfil (sexo y edad) para que pueda calcular lo que gastas.",btn:{attr:'data-go="ajustes"',txt:"Ir a Ajustes"}});
  // 4. Pesaje semanal
  const W=[...D.pesos].sort((a,b)=>a.fecha<b.fecha?-1:1), lastW=W[W.length-1];
  if(!lastW||daysBetween(lastW.fecha,today)>=7) tips.push({t:"info",h:`⚖️ ${lastW?`Hace ${daysBetween(lastW.fecha,today)} días que no te pesas`:"Aún no has registrado tu peso"}. Pésate por la mañana, en ayunas.`,btn:{attr:'data-go="peso"',txt:"Registrar peso"}});
  // 5. Ajuste automático de calorías según la tendencia del peso (3 semanas)
  const W21=W.filter(w=>w.fecha>=addDays(today,-21));
  if(W21.length>=3&&daysBetween(W21[0].fecha,W21[W21.length-1].fecha)>=12){
    const sl=slopePerWeek(W21), puede=!p.ultimoAjuste||daysBetween(p.ultimoAjuste,today)>=14;
    const k=objKey(), slTxt=`${sl>0?"+":""}${fmtKg(Math.round(sl*100)/100)} kg/semana`, minK=kcalMinSegura(pesoEn(today));
    const baja=v=>Math.max(minK,+p.objKcal-v);
    if(k==="recomp"){
      if(puede&&sl<-0.2) tips.push({t:"warn",h:`Estás perdiendo peso (${slTxt}). Para tonificar sin perder músculo, sube tu objetivo a <b>${fmtK(+p.objKcal+150)} kcal</b>.`,btn:{attr:'data-coach="150"',txt:`Subir a ${fmtK(+p.objKcal+150)} kcal`}});
      else if(puede&&sl>0.25) tips.push({t:"info",h:`Tu peso sube (${slTxt}). Si no buscas ganar peso, baja el objetivo a ${fmtK(baja(100))} kcal.`,btn:{attr:`data-coach="${baja(100)-p.objKcal}"`,txt:`Bajar a ${fmtK(baja(100))} kcal`}});
    } else if(k==="perder"){
      if(puede&&sl>-0.1){ if(+p.objKcal-150>=minK) tips.push({t:"warn",h:`📉 En las últimas semanas el peso casi no baja (${slTxt}). Baja tu objetivo a <b>${fmtK(+p.objKcal-150)} kcal</b> o añade un paseo diario de 30 minutos.`,btn:{attr:'data-coach="-150"',txt:`Bajar a ${fmtK(+p.objKcal-150)} kcal`}});
        else tips.push({t:"warn",h:`📉 El peso casi no baja (${slTxt}), pero ya estás cerca del mínimo recomendado de calorías. En vez de comer menos, muévete más: pasos diarios o un paseo de 30–45 minutos.`}); }
      else if(puede&&sl<-0.8) tips.push({t:"warn",h:`Bajas muy rápido (${slTxt}): parte puede ser músculo. Sube tu objetivo a <b>${fmtK(+p.objKcal+150)} kcal</b>.`,btn:{attr:'data-coach="150"',txt:`Subir a ${fmtK(+p.objKcal+150)} kcal`}});
    } else
    if(puede&&sl<0.1) tips.push({t:"warn",h:`📈 En las últimas semanas el peso casi no sube (${fmtKg(Math.round(sl*100)/100)} kg/semana). Para seguir ganando músculo, sube tu objetivo de <b>${fmtK(p.objKcal)}</b> a <b>${fmtK(+p.objKcal+150)} kcal</b> (≈ un vaso de leche con cacao más al día).`,btn:{attr:'data-coach="150"',txt:`Subir a ${fmtK(+p.objKcal+150)} kcal`}});
    else if(k==="ganar"&&puede&&sl>0.4) tips.push({t:"info",h:`Subes rápido (${fmtKg(Math.round(sl*100)/100)} kg/semana): parte puede ser grasa. Puedes bajar el objetivo a ${fmtK(+p.objKcal-100)} kcal.`,btn:{attr:'data-coach="-100"',txt:`Bajar a ${fmtK(+p.objKcal-100)} kcal`}});
  }
  // 6. Ejercicios estancados (3 sesiones sin mejorar el 1RM estimado)
  let est=0;
  DIAS.forEach(d=>D.rutina[d].ejercicios.forEach(ex=>{
    if(est>=2) return;
    if(ex.unidad==="min") return;
    const hi=exHistory(ex.id); if(hi.length<4) return;
    if(daysBetween(hi[hi.length-1].fecha,today)>21) return;
    const prev=Math.max(...hi.slice(0,-3).map(x=>x.rm)), ult=Math.max(...hi.slice(-3).map(x=>x.rm));
    if(ult<=prev){ est++; const top=hi[hi.length-1].top;
      tips.push({t:"warn",h:`🔁 <b>${esc(ex.nombre)}</b> lleva 3 sesiones sin mejorar. Prueba bajar a ${fmtKg(r1(top*0.9))} kg (−10 %) y volver a subir poco a poco, o cambia a ${ex.reps+2} repeticiones durante 2 semanas. Revisa también sueño y calorías.`}); }
  }));
  // 8. Medidas cada 4 semanas
  const Ms=[...D.medidas].sort((a,b)=>a.fecha<b.fecha?-1:1), lastM=Ms[Ms.length-1];
  if(ses.length&&(!lastM||daysBetween(lastM.fecha,today)>=28)) tips.push({t:"info",h:`📏 ${lastM?`Hace ${daysBetween(lastM.fecha,today)} días de tus últimas medidas`:"Aún no has registrado tus medidas"}. Mídete (cintura, cadera, muslo, brazo) y haz tus 3 fotos: así se ve el progreso real.`,btn:{attr:'data-go="peso"',txt:"Registrar medidas"}});
  // 9. Semana de descarga cada ~7 semanas de entreno
  if(ses.length){
    const base=[ses[0].fecha,D.ultimaDescarga||""].sort().pop();
    const recientes=ses.filter(s=>s.fecha>=addDays(today,-14)).length;
    if(daysBetween(base,today)>=49&&recientes>=3) tips.push({t:"info",h:"🧘 Llevas unas 7 semanas entrenando fuerte. Esta semana haz <b>semana de descarga</b>: los mismos ejercicios con un 30 % menos de peso o la mitad de series. Recuperas y luego progresas mejor.",btn:{attr:'data-descarga="1"',txt:"Hecho: empiezo la descarga"}});
  }
  // 7. Salud sin importar
  if(p.fuenteAct==="salud"&&hora>=20&&!(dia(today).salud&&dia(today).salud.ts)) tips.push({t:"info",h:"📲 Ejecuta el atajo <b>Salud → Diario</b> y pega tus datos para calcular el gasto de hoy.",btn:{attr:'data-go="calorias"',txt:"Ir a Calorías"}});
  return tips;
}

/* =====================================================================
   CALORÍAS: comida, actividad y balance
   ===================================================================== */
let calFecha=hoy();
/* Datos de Salud (iPhone): el Atajo genera un texto tipo "activa=512;pasos=8423;peso=56,4" */
function parseSalud(text){
  const out={};
  const txt=String(text||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\u00a0/g," ");
  const re=/(energia\s*activa|activa|pasos|peso|fecha)\s*[=:]\s*([^;&\n\r]+)/gi; let m;
  while((m=re.exec(txt))){ let k=m[1].toLowerCase(); if(k.includes("activa")) k="activa"; out[k]=m[2].trim(); }
  if(!Object.keys(out).length){ // sin etiquetas: "512 8423" o "512\n8423" → activa y pasos
    const nums=txt.match(/\d[\d.,]*/g)||[];
    if(nums.length===2){ out.activa=nums[0]; out.pasos=nums[1]; }
  }
  const r={fecha:/^\d{4}-\d{2}-\d{2}$/.test(out.fecha||"")?out.fecha:hoy()};
  if(out.activa!=null){ const v=parseNumES(out.activa); if(v!=null&&v>=0&&v<10000) r.activa=Math.round(v); }
  if(out.pasos!=null){ const v=parseNumES(out.pasos); if(v!=null&&v>=0&&v<200000) r.pasos=Math.round(v); }
  if(out.peso!=null){ const v=parseNumES(out.peso); if(v!=null&&v>20&&v<250) r.peso=r1(v); }
  return (r.activa!=null||r.pasos!=null||r.peso!=null)?r:null;
}
function applySalud(r){
  const d=diaW(r.fecha);
  d.salud={...(d.salud||{}),ts:Date.now()};
  if(r.activa!=null) d.salud.activa=r.activa;
  if(r.pasos!=null) d.salud.pasos=r.pasos;
  if(r.peso!=null){ D.pesos=D.pesos.filter(w=>w.fecha!==r.fecha); D.pesos.push({id:r.fecha,fecha:r.fecha,kg:r.peso}); }
  let cambio=false;
  if(r.activa!=null&&D.perfil.fuenteAct!=="salud"){ D.perfil.fuenteAct="salud"; cambio=true; }
  return cambio;
}
function importSaludText(t0){
  const t=t0; const r=parseSalud(t);
  if(!r){
    toast("No encuentro datos de Salud en ese texto",true);
    const box=$("#s-manual"); if(box){ box.classList.remove("hidden");
      let info=$("#s-leido"); if(!info){ info=document.createElement("div"); info.id="s-leido"; info.className="note"; info.style.marginTop="8px"; box.appendChild(info); }
      const t=String(t0||"").trim();
      info.textContent = t ? `He leído del portapapeles: «${t.slice(0,160)}${t.length>160?"…":""}». Tiene que parecerse a: activa=512;pasos=8423` : "El portapapeles está vacío: ejecuta antes el atajo Salud → Diario."; }
    return false;
  }
  const cambio=applySalud(r); calFecha=r.fecha; commit();
  const partes=[r.activa!=null?`${fmtK(r.activa)} kcal activas`:"",r.pasos!=null?`${fmtK(r.pasos)} pasos`:"",r.peso!=null?`${fmtKg(r.peso)} kg`:""].filter(Boolean);
  toast("Salud: "+partes.join(" · ")+(cambio?" (actividad ahora desde Salud)":""));
  return true;
}
function dia(f){ return D.dias[f]||{comidas:[],actividades:[]}; }
function diaW(f){ if(!D.dias[f]) D.dias[f]={comidas:[],actividades:[]}; return D.dias[f]; }
/* ---------- Objetivos ---------- */
const OBJETIVOS={
  ganar:{nombre:"💪 Ganar músculo",fase:"Fase de volumen",ritmoTxt:"ganar unos 0,2–0,3 kg por semana (más rápido suele ser grasa)"},
  recomp:{nombre:"⚖️ Tonificar / recomposición",fase:"Recomposición",ritmoTxt:"mantener el peso estable (±0,15 kg por semana) mientras la cintura se mantiene o baja"},
  perder:{nombre:"🔥 Perder grasa sin perder músculo",fase:"Definición",ritmoTxt:"perder unos 0,3–0,5 kg por semana (más rápido suele ser músculo)"}
};
function objKey(){ return OBJETIVOS[D.perfil.objetivo]?D.perfil.objetivo:"ganar"; }
function deficitObj(){ return Math.max(200,Math.min(700,+D.perfil.deficit||400)); }
// Rango de balance (comido − gastado) que encaja con el objetivo
function rangoBal(){ const k=objKey(); if(k==="ganar") return {min:+D.perfil.superavit||0,max:null}; if(k==="recomp") return {min:-200,max:250}; return {min:-deficitObj()-250,max:-150}; }
function balEstado(b){ if(b==null) return null; const r=rangoBal(); if(b<r.min) return "bajo"; if(r.max!=null&&b>r.max) return "alto"; return "ok"; }
// Mínimo de calorías que nunca recomendamos bajar
function kcalMinSegura(kg){ const base=D.perfil.sexo==="h"?1500:1200; return Math.max(base, perfilOK()?Math.round(bmr(kg)/50)*50:base); }
function recomendacion(){
  if(!perfilOK()) return null;
  const p=D.perfil, kg=pesoEn(hoy()), k=objKey();
  // media de la actividad apuntada (o importada de Salud) en los últimos 14 días con datos
  const dAct=Array.from({length:14},(_,i)=>addDays(hoy(),-i-1)).filter(f=>{ const d=dia(f); return p.fuenteAct==="salud"?!!(d.salud&&d.salud.activa!=null):d.actividades.length>0; });
  const actMedia=dAct.length>=3?dAct.reduce((a,f)=>a+calc(f).act,0)/dAct.length:0;
  const tdee=bmr(kg)*(+p.factor||1.2)+kcalAct(+p.gymMet||5,+p.gymMin||60,kg)*3/7+actMedia;
  let kcal=tdee+(k==="ganar"?300:k==="recomp"?0:-deficitObj());
  kcal=Math.max(kcalMinSegura(kg),Math.round(kcal/50)*50);
  const prot=Math.round(kg*(k==="perder"?2.0:1.8)/5)*5;
  return {kcal,prot,tdee:Math.round(tdee),kg,actMedia:Math.round(actMedia),diasAct:dAct.length};
}
function perfilOK(){ const p=D.perfil; return (p.sexo==="h"||p.sexo==="m") && +p.edad>0 && +p.altura>0; }
function pesoEn(f){
  const W=[...D.pesos].sort((a,b)=>a.fecha<b.fecha?-1:1);
  const prev=W.filter(w=>w.fecha<=f); if(prev.length) return prev[prev.length-1].kg;
  if(W.length) return W[0].kg;
  return +D.perfil.pesoRef||56;
}
function bmr(kg){ const p=D.perfil; return 10*kg+6.25*(+p.altura)-5*(+p.edad)+(p.sexo==="h"?5:-161); } // Mifflin-St Jeor
const kcalAct=(met,min,kg)=>Math.max(0,(met-1))*kg*min/60; // kcal NETAS (sin contar el reposo, que ya va en el basal)
function calc(f){
  const d=dia(f), p=D.perfil, kg=pesoEn(f);
  const comido=d.comidas.reduce((a,c)=>a+(+c.kcal||0),0);
  const prot=d.comidas.reduce((a,c)=>a+(+c.prot||0),0);
  const base=perfilOK()?bmr(kg)*(+p.factor||1.2):null;
  const usaSalud=p.fuenteAct==="salud";
  const huboGym=D.sesiones.some(s=>s.fecha===f);
  const gym=(huboGym&&!(usaSalud&&p.relojGym))?kcalAct(+p.gymMet||5,+p.gymMin||60,kg):0;
  const act=usaSalud?(+(d.salud&&d.salud.activa)||0):d.actividades.reduce((a,x)=>a+(+x.kcal||0),0);
  const gasto=base==null?null:base+gym+act;
  return {comido,prot,base,gym,act,gasto,kg,usaSalud,salud:d.salud||null,balance:gasto==null?null:comido-gasto};
}
function sugerirComidas(falta){
  const favs=[...D.favoritos].filter(f=>f.kcal>0).sort((a,b)=>a.kcal-b.kcal);
  const one=favs.find(f=>f.kcal>=falta); if(one) return [one];
  const out=[]; let s=0; for(const f of [...favs].reverse()){ if(s>=falta) break; out.push(f); s+=f.kcal; } return out;
}

let foodSel=null, foodPorc=0, foodCant=1, foodGr=100, basket=[];
function foodAmount(){
  const f=FOODS.find(x=>x.id===foodSel); if(!f) return null;

  const label=foodPorc==="g"?`${fmtK(g)} g`:(foodCant===1?`1 ${f.por[foodPorc].l}`:`${fmtKg(foodCant)} × ${f.por[foodPorc].l}`);
  return {n:f.n,label,g:Math.round(g),kcal:Math.round(f.k*g/100),prot:r1(f.p*g/100)};
}
function recientes(){
  const out=[], seen=new Set();
  Object.keys(D.dias).sort().reverse().forEach(f=>{
    [...(D.dias[f].comidas||[])].reverse().forEach(c=>(c.items||[]).forEach(it=>{
      const k=it.n+"|"+it.label; if(!seen.has(k)&&out.length<8){ seen.add(k); out.push(it); }
    }));
  });
  return out;
}

const charts={};
function mkChart(id,cfg){
  if(charts[id]){ charts[id].destroy(); delete charts[id]; }
  const el=document.getElementById(id); if(!el) return;
  if(!window.Chart){ el.parentElement.innerHTML='<div class="empty">No se pudo cargar la librería de gráficos (¿sin conexión?).</div>'; return; }
  charts[id]=new Chart(el,cfg);
}
const gridOpts={color:"#23282b"};
function baseOpts(unit){ return {responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
  plugins:{legend:{labels:{color:"#c9cec9",boxWidth:12,font:{family:"Barlow"}}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y==null?"–":fmtKg(c.parsed.y)} ${unit}`}}},
  scales:{x:{ticks:{color:"#8d9491"},grid:gridOpts},y:{ticks:{color:"#8d9491"},grid:gridOpts,beginAtZero:unit==="kcal"}}}; }
let progEx=null;
function esCardio(id){ const e=EX()[id]; return !!(e&&e.unidad==="min"); }
function volSets(sets){ return Object.entries(sets||{}).filter(([id])=>!esCardio(id)).flatMap(([,a])=>a).reduce((a,x)=>a+(x.kg||0)*(x.reps||0),0); }
function exHistory(id){
  return sortedSessions().filter(s=>s.sets&&s.sets[id]&&s.sets[id].length).map(s=>{
    const sets=s.sets[id];
    return {fecha:s.fecha,top:Math.max(...sets.map(x=>x.kg||0)),rm:Math.max(...sets.map(x=>e1rm(x.kg||0,x.reps||0))),vol:sets.reduce((a,x)=>a+(x.kg||0)*(x.reps||0),0),sets};
  });
}
function resumenSemanal(){
  const today=hoy(), desde=addDays(today,-6), dias=Array.from({length:7},(_,i)=>addDays(desde,i));
  const ent=D.sesiones.filter(s=>s.fecha>=desde&&s.fecha<=today).length;

  const cs=conComida.map(calc);
  const mk=cs.length?cs.reduce((a,x)=>a+x.comido,0)/cs.length:null, mp=cs.length?cs.reduce((a,x)=>a+x.prot,0)/cs.length:null;
  const okBal=cs.filter(x=>balEstado(x.balance)==="ok").length, conBal=cs.filter(x=>x.balance!=null).length;
  const W=[...D.pesos].sort((a,b)=>a.fecha<b.fecha?-1:1), ult=W[W.length-1], ant=[...W].reverse().find(w=>w.fecha<=addDays(today,-7));

function slopePerWeek(pts){
  if(pts.length<2) return null;
  const xs=pts.map(p=>new Date(p.fecha+"T12:00").getTime()/864e5), ys=pts.map(p=>p.kg);
  const mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  let nu=0,de=0; xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my); de+=(x-mx)**2;});
  return de?nu/de*7:null;
}

function backupJSON(){ return JSON.stringify({app:"diario-fuerza",exportado:new Date().toISOString(),...D},null,2); }
function importData(data,mode){
  // Admite copias de esta versión y de la anterior (sesiones / peso_corporal)
  const inc=normalize({
    ...(data.v===2?data:{}),
    sesiones:data.sesiones||data.sessions||[],
    pesos:data.pesos||data.peso_corporal||data.weights||[]
  });
  if(mode==="replace"){ D=data.v===2?inc:{...emptyData(),sesiones:inc.sesiones,pesos:inc.pesos}; return; }
  inc.sesiones.filter(s=>s&&s.fecha&&s.sets).forEach(s=>{ const id=s.id||uid("s"); D.sesiones=D.sesiones.filter(x=>x.id!==id); D.sesiones.push({...s,id}); });
  inc.pesos.filter(w=>w&&w.fecha&&typeof w.kg==="number").forEach(w=>{ D.pesos=D.pesos.filter(x=>x.fecha!==w.fecha); D.pesos.push({id:w.fecha,fecha:w.fecha,kg:w.kg}); });
  if(data.v===2){
    Object.entries(inc.dias).forEach(([f,d])=>{ const cur=diaW(f);
      (d.comidas||[]).forEach(c=>{ if(!cur.comidas.some(x=>x.id===c.id)) cur.comidas.push(c); });
      (d.actividades||[]).forEach(a=>{ if(!cur.actividades.some(x=>x.id===a.id)) cur.actividades.push(a); }); });
    inc.favoritos.forEach(f=>{ if(!D.favoritos.some(x=>x.id===f.id)) D.favoritos.push(f); });
    inc.medidas.forEach(m=>{ if(m&&m.fecha){ D.medidas=D.medidas.filter(x=>x.fecha!==m.fecha); D.medidas.push(m); } });
    Object.assign(D.archivo,inc.archivo);
    // Ejercicios de la copia que no están en la rutina actual: se guardan en el archivo para conservar el nombre
    diasDe(inc.rutina).forEach(d=>inc.rutina[d].ejercicios.forEach(e=>{ if(!EX()[e.id]) D.archivo[e.id]={nombre:e.nombre,musculo:e.musculo,...(e.unidad?{unidad:e.unidad}:{})}; }));
  }
}

/* ---------- Plan recomendado según objetivo, días y prioridad ---------- */
function planRecomendado(){
  const p=D.perfil, k=objKey(), dias=[3,4,5].includes(+p.diasSemana)?+p.diasSemana:3;
  const foco=p.foco||(p.sexo==="h"?"equilibrado":"gluteo");
  let key;
  if(dias===4) key="torso"; else if(dias===5) key="grupos";
  else key = k==="perder"?"perder" : k==="recomp"?"recomp" : (foco==="gluteo"?"ganar":"clasica");
  const pr=PLANTILLAS[key].rutina, dsP=diasDe(pr), conCardio=d=>pr[d].ejercicios.some(e=>e.unidad==="min");
  const cardio = k==="perder" ? (dsP.every(conCardio)?null:"perder") : (k==="recomp"&&!dsP.some(conCardio)) ? "recomp" : null;
  return {key,cardio,dias,foco,sig:key+"|"+(cardio||"")};
}
function construirRutina(key,cardio){
  const r=clone(PLANTILLAS[key].rutina), ds=diasDe(r), cs=["C1","C2","C3"];
  if(cardio==="perder") ds.forEach((d,i)=>{ r[d].ejercicios=r[d].ejercicios.filter(e=>e.unidad!=="min"); r[d].ejercicios.push({id:cs[i%3],...CATALOGO[cs[i%3]],series:1,reps:20,descanso:0,rir:0,inc:0}); if(!/cardio/i.test(r[d].enfoque)) r[d].enfoque+=" + cardio"; });
  if(cardio==="recomp") [ds[0],ds[ds.length-1]].forEach(d=>{ if(!r[d].ejercicios.some(e=>e.unidad==="min")){ r[d].ejercicios.push({id:"C1",...CATALOGO.C1,series:1,reps:10,descanso:0,rir:0,inc:0}); r[d].enfoque+=" + cardio"; } });
  return r;
}
function nombrePlan(rec){ const pl=PLANTILLAS[rec.key]; return pl.nombre+(rec.cardio==="perder"?" + 20 min de cardio cada día":rec.cardio==="recomp"?" + 10 min de cardio 2 días":""); }
function cargarPlantilla(key,cardio){
  const pl=PLANTILLAS[key]; if(!pl) return;
  const r=construirRutina(key,cardio||null);
  const nuevos=new Set(diasDe(r).flatMap(d=>r[d].ejercicios.map(e=>e.id)));
  DIAS.forEach(d=>D.rutina[d].ejercicios.forEach(e=>{ if(!nuevos.has(e.id)) D.archivo[e.id]={nombre:e.nombre,musculo:e.musculo,...(e.unidad?{unidad:e.unidad}:{})}; }));
  nuevos.forEach(id=>delete D.archivo[id]);
  D.rutina=r; D.plantilla=key; D.planSig=key+"|"+(cardio||""); rutEdit=null;
  if(form&&!form.id&&!formHasData()) form=null;

const SUPABASE_URL = ((window.DF_CONFIG||{}).SUPABASE_URL||"").trim().replace(/\/(rest|auth)\/v1\/?$/,"").replace(/\/+$/,"");
const SUPABASE_ANON_KEY = (((window.DF_CONFIG||{}).SUPABASE_ANON_KEY||"").trim()).replace(/^PEGA_AQUI.*$/,"");
const NUBE_OK = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
let sb=null, sbUser=null, subidaTimer=null, nubeEstado="", ultimaBajada=0, wizardTrasLogin=false;
const SYNC_KEY="diarioFuerza.sync";
function syncInfo(){ return lsGet(SYNC_KEY)||{}; }
function setSync(o){ lsSet(SYNC_KEY,{...syncInfo(),...o}); }
function pintarEstado(){
  if(sbUser&&nubeEstado==="ok") setStatus("ok","☁️ Guardado en la nube");
  else if(sbUser&&nubeEstado==="pendiente") setStatus("ok","☁️ Guardando…");
  else if(sbUser&&nubeEstado==="error") setStatus("bad","Sin conexión: se subirá luego");
  else setStatus("ok","Guardado en este dispositivo");
}
async function initNube(){
  if(!NUBE_OK||!window.supabase) return;
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    const {data}=await sb.auth.getSession(); sbUser=data&&data.session?data.session.user:null;
    sb.auth.onAuthStateChange((ev,s)=>{ sbUser=s?s.user:null; pintarEstado(); if(tab==="ajustes") renderSettings();
      if(ev==="PASSWORD_RECOVERY"){ lgModo="nueva"; lgMsg=null; abrirLogin(); } });
    if(sbUser){ cerrarLogin(); await alEntrar(); }
    else if(!/type=recovery/.test(location.hash)){ cerrarWizard(); abrirLogin("entrar"); }
    pintarEstado();
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&sbUser&&Date.now()-ultimaBajada>30000) bajar(); });
  }catch(e){ console.warn("Nube no disponible",e); }
}
function programarSubida(){ if(!sb||!sbUser) return; nubeEstado="pendiente"; pintarEstado(); clearTimeout(subidaTimer); subidaTimer=setTimeout(subir,2000); }
async function subir(){
  if(!sb||!sbUser) return false;
  try{
    const mod=D.modificado||Date.now();
    const {error}=await sb.from("datos_usuario").upsert({user_id:sbUser.id,datos:D,actualizado:new Date(mod).toISOString()});
    if(error) throw error;
    setSync({uid:sbUser.id,lastSync:mod}); nubeEstado="ok"; pintarEstado(); return true;
  }catch(e){ console.warn(e); nubeEstado="error"; pintarEstado(); return false; }
}
async function bajar(){
  if(!sb||!sbUser) return;
  ultimaBajada=Date.now();
  try{
    const {data,error}=await sb.from("datos_usuario").select("datos").eq("user_id",sbUser.id).maybeSingle();
    if(error) throw error;
    const s=syncInfo(), remoto=data&&data.datos?data.datos:null;
    if(!remoto){
      if(s.uid&&s.uid!==sbUser.id){ D=emptyData(); lsSet(KEY,D); setSync({uid:sbUser.id,lastSync:0}); form=null; renderCurrent(); }
      if(D.onboarded) await subir(); else { nubeEstado="ok"; pintarEstado(); } return; }
    const rMod=remoto.modificado||0, lMod=D.modificado||0, last=s.uid===sbUser.id?(s.lastSync||0):0;
    const localConDatos=D.onboarded&&(D.sesiones.length||D.pesos.length||Object.keys(D.dias).length);
    if(s.uid&&s.uid!==sbUser.id){
      // el móvil tenía datos de OTRA cuenta: nunca se mezclan
      D=normalize(remoto); D.onboarded=true; lsSet(KEY,D); setSync({uid:sbUser.id,lastSync:rMod});
    } else if(s.uid!==sbUser.id){
      // primera vez en este dispositivo con esta cuenta
      if(localConDatos){ importData(remoto,"merge"); persist(true); D.modificado=Date.now(); lsSet(KEY,D); await subir(); }
      else { D=normalize(remoto); D.onboarded=true; lsSet(KEY,D); setSync({uid:sbUser.id,lastSync:rMod}); }
    } else if(rMod>last&&lMod>last){ importData(remoto,"merge"); D.modificado=Date.now(); lsSet(KEY,D); await subir(); }
    else if(rMod>last){ D=normalize(remoto); D.onboarded=true; lsSet(KEY,D); setSync({lastSync:rMod}); }
    else if(lMod>last){ await subir(); }
    nubeEstado="ok"; pintarEstado(); form=null; renderCurrent();
    if(D.onboarded&&wizardTrasLogin&&$("#wizard").classList.contains("show")) cerrarWizard();
  }catch(e){ console.warn(e); nubeEstado="error"; pintarEstado(); }
}
function traducirError(e){
  const m=String(e&&e.message||e);
  if(/Invalid login credentials/i.test(m)) return "Email o contraseña incorrectos";
  if(/already registered|already been registered/i.test(m)) return "Ya existe una cuenta con ese email: pulsa «Entrar»";
  if(/Password should be at least/i.test(m)) return "La contraseña debe tener al menos 8 caracteres";
  if(/Email not confirmed/i.test(m)) return "Confirma tu email antes de entrar (revisa tu bandeja de entrada)";
  if(/rate limit/i.test(m)) return "Demasiados intentos: espera unos minutos";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Sin conexión a internet";
  return m;
}

async function enviarLogin(btn){
  const m=lgModo, email=$("#lg-email")?$("#lg-email").value.trim():"", pass=$("#lg-pass")?$("#lg-pass").value:"", pass2=$("#lg-pass2")?$("#lg-pass2").value:"";
  const err=t=>{ lgMsg={t}; renderLogin(); };
  if(m!=="nueva"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err("Escribe un email válido");
  if(m!=="olvido"&&pass.length<8) return err("La contraseña debe tener al menos 8 caracteres");
  if((m==="crear"||m==="nueva")&&pass!==pass2) return err("Las dos contraseñas no coinciden");
  if(!navigator.onLine) return err("Necesitas conexión a internet para entrar");
  btn.disabled=true; btn.textContent="Un momento…";
  try{
    if(m==="olvido"){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(error) throw error; lgModo="entrar"; lgMsg={ok:true,t:"Si el email está registrado, te llegará un enlace para cambiar la contraseña."}; renderLogin(); return;
    }

      const {error}=await sb.auth.updateUser({password:pass}); if(error) throw error;
      lgMsg=null; cerrarLogin(); toast("Contraseña cambiada"); await alEntrar(); return;

    sbUser=r.data.session.user; lgMsg=null; cerrarLogin(); await alEntrar();

}

    <div class="seg">${[3,4,5].map(n=>`<button data-dsem="${n}" class="${(+D.perfil.diasSemana||3)===n?"on":""}">${n} días</button>`).join("")}</div>
    <div class="h2" style="margin-top:14px;font-size:17px">¿Qué quieres priorizar?</div>
    <div class="seg"><button data-foco="gluteo" class="${planRecomendado().foco==="gluteo"?"on":""}">🍑 Glúteo y piernas</button><button data-foco="equilibrado" class="${planRecomendado().foco==="equilibrado"?"on":""}">⚖️ Todo el cuerpo por igual</button></div>
    ${(()=>{ const rec=planRecomendado(), actual=D.planSig||((D.plantilla||"ganar")+"|"); const pl=PLANTILLAS[rec.key];
      return actual===rec.sig
        ?`<div class="banner good" style="margin:12px 0 0">✅ Estás usando la rutina recomendada para ti: <b>${esc(nombrePlan(rec))}</b>.</div>`
        :`<div class="banner" style="margin:12px 0 0">Tu rutina recomendada: <b>${esc(nombrePlan(rec))}</b>. ${esc(pl.desc)}<div style="margin-top:8px"><button class="btn sm" data-plan="1">Usar esta rutina</button></div></div>`; })()}
    ${rec?`<div class="banner good" style="margin:10px 0 0">Recomendado para ti: <b>${fmtK(rec.kcal)} kcal</b> y <b>${fmtK(rec.prot)} g de proteína</b> al día <span style="opacity:.8">(gastas unas ${fmtK(rec.tdee)} kcal al día con ${fmtKg(rec.kg)} kg${rec.actMedia?`, contando tu actividad media de ${fmtK(rec.actMedia)} kcal`:""})</span>.${rec.diasAct<3?`<br><span style="opacity:.85">Aún no tengo suficiente actividad apuntada: si trabajas de pie o caminas mucho, apunta unos días tu actividad (o pon "Día normal" más activo abajo) y la recomendación será más exacta.</span>`:""} Ahora tienes ${fmtK(p.objKcal)} kcal y ${fmtK(p.objProt)} g.
      <div style="margin-top:8px"><button class="btn sm" id="rec-apply">Usar estos objetivos</button></div></div>`:`<div class="note" style="margin-top:8px">Rellena sexo, edad y altura para ver tus calorías recomendadas.</div>`}
  </div>
  <div class="card"><div class="h2">Perfil</div>
    <div class="grid3">
      <label class="f">Sexo<select id="p-sexo"><option value="">—</option><option value="h" ${p.sexo==="h"?"selected":""}>Hombre</option><option value="m" ${p.sexo==="m"?"selected":""}>Mujer</option></select></label>
      <label class="f">Edad<input type="number" inputmode="numeric" id="p-edad" value="${esc(p.edad)}"></label>
      <label class="f">Altura (cm)<input type="number" inputmode="numeric" id="p-altura" value="${esc(p.altura)}"></label>
      <label class="f">Peso de partida (kg)<input type="number" inputmode="decimal" step="0.1" id="p-pesoRef" value="${esc(p.pesoRef)}"></label>
      <label class="f">Objetivo kcal/día<input type="number" inputmode="numeric" id="p-objKcal" value="${esc(p.objKcal)}"></label>
      <label class="f">Objetivo proteína (g)<input type="number" inputmode="numeric" id="p-objProt" value="${esc(p.objProt)}"></label>
      <label class="f" style="grid-column:span 2">Día normal (sin contar lo que apuntes)<select id="p-factor">
        <option value="1.2" ${+p.factor===1.2?"selected":""}>Sedentario · ×1,2 (recomendado si apuntas la actividad)</option>
        <option value="1.3" ${+p.factor===1.3?"selected":""}>Algo activo · ×1,3</option>
        <option value="1.35" ${+p.factor===1.35?"selected":""}>De pie o caminando gran parte del día · ×1,35</option>
        <option value="1.4" ${+p.factor===1.4?"selected":""}>Activo · ×1,4 (si no vas a apuntar actividad)</option>
        <option value="1.5" ${+p.factor===1.5?"selected":""}>Trabajo físico · ×1,5</option></select></label>
      <label class="f">${objKey()==="perder"?"Déficit objetivo (kcal)":"Superávit mínimo (kcal)"}<input type="number" inputmode="numeric" id="p-${objKey()==="perder"?"deficit":"superavit"}" value="${esc(objKey()==="perder"?deficitObj():p.superavit)}"></label>
      <label class="f">Minutos de gimnasio<input type="number" inputmode="numeric" id="p-gymMin" value="${esc(p.gymMin)}"></label>
      <label class="f">MET del gimnasio<input type="number" inputmode="decimal" step="0.1" id="p-gymMet" value="${esc(p.gymMet)}"></label>
      <label class="f" style="grid-column:span 2">Actividad fuera del gimnasio<select id="p-fuenteAct">
        <option value="manual" ${p.fuenteAct!=="salud"?"selected":""}>La apunto a mano</option>
        <option value="salud" ${p.fuenteAct==="salud"?"selected":""}>La importo de Salud (iPhone)</option></select></label>
      <label class="f" style="justify-content:flex-end"><span><input type="checkbox" id="p-relojGym" ${p.relojGym?"checked":""}> Llevo Apple Watch en el gimnasio</span></label>
    </div>
    <div class="note" style="margin-top:8px">Gasto = metabolismo basal (fórmula Mifflin-St Jeor) × día normal + gimnasio + actividades que apuntes. ${objKey()==="perder"?`"Déficit objetivo" es cuánto comer por debajo de lo que gastas (entre 200 y 700; 400 es un buen punto de partida). Nunca te recomendaremos menos de ${fmtK(kcalMinSegura(pesoEn(hoy())))} kcal al día.`:`"Superávit mínimo" es lo que quieres comer por encima de lo que gastas (0 = al menos lo mismo; 300 es habitual en volumen).`} Son estimaciones: si el peso no sube en 2–3 semanas, sube el objetivo de kcal.</div>
    <button class="btn pri" id="p-save" style="margin-top:10px">Guardar perfil</button>
  </div>`;

  // Editor de rutina
  h+=`<div class="card"><div class="h2">Elegir rutina</div>
    <div class="note" style="margin-bottom:10px">Cambia de rutina cuando quieras: los ejercicios que se repiten conservan su historial y los demás quedan guardados en Progreso.</div>
    ${Object.entries(PLANTILLAS).map(([k,pl])=>{ const act=(D.plantilla||"ganar")===k; const dP=diasDe(pl.rutina), nEj=dP.reduce((a,d)=>a+pl.rutina[d].ejercicios.length,0), card=dP.some(d=>pl.rutina[d].ejercicios.some(e=>e.unidad==="min"));
      return `<div class="ed-ex" style="${act?"border-color:var(--acc)":""}"><div class="row" style="justify-content:space-between"><b>${esc(pl.nombre)}</b>${act?'<span class="chip ok">En uso</span>':`<button class="btn sm" data-plantilla="${k}">Usar esta</button>`}</div>
        <div class="note" style="margin-top:4px">${esc(pl.desc)}</div>
        <details class="note" style="margin-top:6px"><summary style="cursor:pointer">Ver ejercicios (${dP.length} días · ${nEj} ejercicios${card?", con cardio":""})</summary>${dP.map(d=>`<div style="margin-top:6px;color:var(--text)"><b>${d}</b> · ${esc(pl.rutina[d].enfoque)}<br><span class="note">${pl.rutina[d].ejercicios.map(e=>`${esc(e.nombre)} ${e.unidad==="min"?e.reps+" min":e.series+"×"+e.reps+(e.unidad==="s"?" s":"")}`).join(" · ")}</span></div>`).join("")}</details></div>`; }).join("")}
  </div>`;
  h+=`<div class="card"><div class="h2">Editar mi rutina</div><div class="note" style="margin-bottom:10px">Cambia ejercicios, series, repeticiones, descanso (s), RIR y cuánto subir (kg). Los cambios se aplican al pulsar <b>Guardar rutina</b>. El historial de los ejercicios que quites se conserva.</div>`;
  const dE=diasDe(rutEdit), libres=SEMANA.filter(x=>!rutEdit[x]);
  dE.forEach(d=>{
    const R=rutEdit[d], legs=R.ejercicios.filter(e=>PIERNA.includes(e.musculo)).length;
    const otros=R.ejercicios.filter(e=>!PIERNA.includes(e.musculo)&&e.musculo!=="Cardio"&&e.musculo!=="Core").length;
    h+=`<div style="margin:16px 0 6px" class="row">
      <select data-rendia="${d}" style="font-weight:600">${[d,...libres].sort((a,b)=>SEMANA.indexOf(a)-SEMANA.indexOf(b)).map(x=>`<option ${x===d?"selected":""}>${x}</option>`).join("")}</select>
      <input type="text" data-enf="${d}" value="${esc(R.enfoque)}" placeholder="Enfoque del día" style="flex:1">
      ${dE.length>1?`<button class="btn sm danger" data-deldia="${d}">Quitar día</button>`:""}</div>
      ${legs>2&&otros>=2?`<div class="banner" style="margin:6px 0">Este día mezcla ${legs} ejercicios de pierna con tren superior: puede ser mucho para un solo día y dar agujetas fuertes.</div>`:""}`;
    R.ejercicios.forEach((e,i)=>{
      h+=`<div class="ed-ex">
        <div class="ed-top">
          <input type="text" data-d="${d}" data-i="${i}" data-k="nombre" value="${esc(e.nombre)}" placeholder="Nombre del ejercicio">
          <select data-d="${d}" data-i="${i}" data-k="musculo">${MUSCULOS.map(m=>`<option ${m===e.musculo?"selected":""}>${m}</option>`).join("")}</select>
          <div class="mini"><button class="btn sm" data-mv="up" data-d="${d}" data-i="${i}" ${i===0?"disabled":""}>↑</button><button class="btn sm" data-mv="down" data-d="${d}" data-i="${i}" ${i===R.ejercicios.length-1?"disabled":""}>↓</button><button class="btn sm danger" data-mv="del" data-d="${d}" data-i="${i}">✕</button></div>
        </div>
        <div class="ed-nums">
          ${[["series","Series",1],["reps","Reps",1],["descanso","Descanso",15],["rir","RIR",1],["inc","Subir kg",.5]].map(([k,l,st])=>`<label class="f">${l}<input type="number" inputmode="decimal" step="${st}" min="0" data-d="${d}" data-i="${i}" data-k="${k}" value="${esc(e[k])}"></label>`).join("")}
        </div></div>`;
    });
    h+=`<button class="btn" data-addex="${d}">+ Añadir ejercicio a ${d}</button>`;
  });
  if(libres.length) h+=`<div style="margin-top:14px"><button class="btn" id="r-addday">+ Añadir otro día de entreno</button></div>`;
  h+=`<div class="btns" style="margin-top:14px"><button class="btn pri" id="r-save">Guardar rutina</button><button class="btn" id="r-discard">Descartar cambios</button><button class="btn danger" id="r-reset">Restaurar rutina original</button></div></div>`;

  // Favoritos
  h+=`<div class="card"><div class="h2">Comidas favoritas</div><div class="note" style="margin-bottom:8px">Aparecen como botones rápidos en Calorías. Añade nuevas desde Calorías → "Añadir otra comida" marcando "Guardar como favorita".</div>
    ${D.favoritos.map(f=>`<div class="li"><div>${esc(f.nombre)}<div class="m">${fmtK(f.kcal)} kcal · ${fmtK(f.prot||0)} g proteína</div></div><button class="btn danger sm" data-delfav="${esc(f.id)}">✕</button></div>`).join("")||'<div class="empty">Sin favoritas.</div>'}
    <button class="btn" id="fav-reset" style="margin-top:10px">Añadir comidas de ejemplo (plan de volumen)</button></div>`;
  h+=cuentaHTML();
  $("#tab-ajustes").innerHTML=h;
}
$("#tab-ajustes").addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.enf){ rutEdit[t.dataset.enf].enfoque=t.value; }
  else if(t.dataset.d&&t.dataset.k){
    const ex=rutEdit[t.dataset.d].ejercicios[+t.dataset.i];
    ex[t.dataset.k]=["nombre","musculo"].includes(t.dataset.k)?t.value:t.value;
  }
});
$("#tab-ajustes").addEventListener("change",e=>{
  if(e.target.dataset.k==="musculo") renderSettings();
  if(e.target.dataset.rendia){ const de=e.target.dataset.rendia, a=e.target.value; if(a===de||rutEdit[a]) return;
    const n={}; diasDe({...rutEdit,[a]:1}).forEach(x=>{ if(x===a) n[a]=rutEdit[de]; else if(x!==de) n[x]=rutEdit[x]; }); rutEdit=n; renderSettings(); toast(`${de} → ${a}. Pulsa Guardar rutina para aplicarlo`); }
});
$("#tab-ajustes").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="p-save"){
    const g=id=>$("#p-"+id).value;
    const np={sexo:g("sexo"),edad:num(g("edad"))||"",altura:num(g("altura"))||"",pesoRef:num(g("pesoRef"))||56,factor:num(g("factor"))||1.2,
      objKcal:num(g("objKcal"))||2400,objProt:num(g("objProt"))||110,gymMin:num(g("gymMin"))||0,gymMet:num(g("gymMet"))||5};
    if($("#p-superavit")) np.superavit=num(g("superavit"))||0;
    if($("#p-deficit")) np.deficit=Math.max(200,Math.min(700,num(g("deficit"))||400));
    np.fuenteAct=g("fuenteAct"); np.relojGym=$("#p-relojGym").checked;
    D.perfil={...D.perfil,...np}; commit(); toast("Perfil guardado");
  } else if(b.id&&b.id.startsWith("nube-")){ accionCuenta(b.id,b);
  } else if(b.id==="wz-open"){ abrirWizard();
  } else if(b.dataset.plantilla){
    if(!armed(b,"¿Seguro? Pulsa otra vez")) return;
    cargarPlantilla(b.dataset.plantilla);
  } else if(b.dataset.plan){
    if(!armed(b,"¿Seguro? Cambia tu rutina")) return;
    const rec=planRecomendado(); cargarPlantilla(rec.key,rec.cardio);
  } else if(b.dataset.dsem){
    D.perfil.diasSemana=+b.dataset.dsem; commit();
  } else if(b.dataset.foco){
    D.perfil.foco=b.dataset.foco; commit();
  } else if(b.dataset.obj){
    if(b.dataset.obj===objKey()) return;
    D.perfil.objetivo=b.dataset.obj; commit();
    const r=recomendacion(); toast(r?`Objetivo cambiado. Revisa las calorías recomendadas: ${fmtK(r.kcal)} kcal`:"Objetivo cambiado");
  } else if(b.id==="rec-apply"){
    const r=recomendacion(); if(!r) return;
    D.perfil.objKcal=r.kcal; D.perfil.objProt=r.prot; D.perfil.ultimoAjuste=hoy(); commit(); toast(`Objetivos: ${fmtK(r.kcal)} kcal y ${fmtK(r.prot)} g de proteína`);
  } else if(b.dataset.mv){
    const arr=rutEdit[b.dataset.d].ejercicios, i=+b.dataset.i;
    if(b.dataset.mv==="del"){ if(!armed(b,"¿Quitar?")) return; arr.splice(i,1); }
    else { const j=b.dataset.mv==="up"?i-1:i+1; [arr[i],arr[j]]=[arr[j],arr[i]]; }
    renderSettings();
  } else if(b.dataset.deldia){
    if(!armed(b,"¿Quitar?")) return; delete rutEdit[b.dataset.deldia]; renderSettings();
  } else if(b.id==="r-addday"){
    const libre=SEMANA.find(x=>!rutEdit[x]); if(!libre) return;
    rutEdit[libre]={enfoque:"Nuevo día",ejercicios:[]}; const n={}; diasDe(rutEdit).forEach(x=>n[x]=rutEdit[x]); rutEdit=n; renderSettings(); toast(`Añadido ${libre}: cambia el día en el desplegable si quieres y añade ejercicios`);
  } else if(b.dataset.addex){
    rutEdit[b.dataset.addex].ejercicios.push({id:uid("X"),nombre:"",musculo:"Pecho",series:3,reps:10,descanso:90,rir:2,inc:2.5});
    renderSettings();
    const ins=document.querySelectorAll(`input[data-d="${b.dataset.addex}"][data-k="nombre"]`); ins[ins.length-1]?.focus();
  } else if(b.id==="r-save"){
    // Validar y normalizar
    for(const d of diasDe(rutEdit)){ if(!rutEdit[d].ejercicios.length){ toast(`El ${d} no tiene ejercicios: añádelos o quita el día`,true); return; } for(const e of rutEdit[d].ejercicios){
      e.nombre=String(e.nombre).trim(); if(!e.nombre){ toast(`Hay un ejercicio sin nombre en ${d}`,true); return; }
      e.series=Math.max(1,Math.round(num(e.series)||1)); e.reps=Math.max(1,Math.round(num(e.reps)||1));
      e.descanso=Math.max(0,Math.round(num(e.descanso)||0)); e.rir=Math.max(0,Math.round(num(e.rir)||0)); e.inc=Math.max(0,num(e.inc)||0);
    }}
    const nuevos=new Set(diasDe(rutEdit).flatMap(d=>rutEdit[d].ejercicios.map(e=>e.id)));
    DIAS.forEach(d=>D.rutina[d].ejercicios.forEach(e=>{ if(!nuevos.has(e.id)) D.archivo[e.id]={nombre:e.nombre,musculo:e.musculo,...(e.unidad?{unidad:e.unidad}:{})}; }));
    nuevos.forEach(id=>delete D.archivo[id]);
    D.rutina=clone(rutEdit); commit(); toast("Rutina guardada");
  } else if(b.id==="r-discard"){ rutEdit=clone(D.rutina); renderSettings(); toast("Cambios descartados"); }
  else if(b.id==="r-reset"){ if(!armed(b,"¿Seguro? Pulsa otra vez")) return; rutEdit=clone(PLANTILLAS[D.plantilla||"ganar"].rutina); renderSettings(); toast("Rutina original cargada: pulsa Guardar rutina para aplicarla"); }
  else if(b.dataset.delfav){ if(!armed(b,"¿Quitar?")) return; D.favoritos=D.favoritos.filter(f=>f.id!==b.dataset.delfav); commit(); }
  else if(b.id==="fav-reset"){ DEFAULT_FAVS.forEach(f=>{ if(!D.favoritos.some(x=>x.id===f.id)) D.favoritos.push(clone(f)); }); commit(); toast("Comidas del plan recuperadas"); }
});

/* =====================================================================
   NAVEGACIÓN
   ===================================================================== */
let tab="entrenar";
const RENDER={entrenar:renderTrain,calorias:renderCal,progreso:renderProgress,peso:renderWeight,historial:renderHistory,ajustes:renderSettings};
function renderCurrent(){ syncDias(); const s=$("#sub"); if(s) s.textContent=`${(PLANTILLAS[D.plantilla]||{}).corto||"Mi rutina"} · ${DIAS.map(d=>INI[d]).join(" / ")} · ${OBJETIVOS[objKey()].fase}`; RENDER[tab](); }
function showTab(t){
  if(!RENDER[t]) t="entrenar";
  tab=t;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  Object.keys(RENDER).forEach(x=>$("#tab-"+x).classList.toggle("hidden",x!==t));
  if(t==="ajustes") rutEdit=null;
  renderCurrent();
  lsSet("diarioFuerza.tab",t);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* Arranque */
D=loadData();
let rutinaMigrada=false;
if((D.rutinaVer||0)<RUTINA_VER){
  // si ya se usaron ids W (versión anterior de esta rutina), pasarlos a los ids de siempre
  D.sesiones.forEach(s=>{ if(!s.sets) return; Object.keys(s.sets).forEach(k=>{ const nk=MAPA_IDS[k]; if(nk){ s.sets[nk]=(s.sets[nk]||[]).concat(s.sets[k]); delete s.sets[k]; } }); });
  Object.keys(MAPA_IDS).forEach(k=>delete D.archivo[k]);
  const nuevos=new Set(diasDe(DEFAULT_RUTINA).flatMap(d=>DEFAULT_RUTINA[d].ejercicios.map(e=>e.id)));
  diasDe(D.rutina).forEach(d=>(D.rutina[d]?.ejercicios||[]).forEach(e=>{ if(!nuevos.has(e.id)) D.archivo[e.id]={nombre:e.nombre,musculo:e.musculo,...(e.unidad?{unidad:e.unidad}:{})}; }));
  nuevos.forEach(id=>delete D.archivo[id]);
  D.rutina=clone(DEFAULT_RUTINA); D.rutinaVer=RUTINA_VER;
  try{ localStorage.removeItem("diarioFuerza.draft"); }catch(e){}
  rutinaMigrada=D.sesiones.length>0||true;
}
if(lsSet("diarioFuerza.test",1)){ try{localStorage.removeItem("diarioFuerza.test");}catch(e){} setStatus("ok","Guardado en este dispositivo"); persist(true); }
else { setStatus("bad","Sin almacenamiento"); $("#banner").innerHTML='<div class="banner bad">Este navegador no permite guardar datos (¿modo incógnito?). Lo que registres se perderá al cerrar.</div>'; }
let startTab=lsGet("diarioFuerza.tab")||"entrenar";
if(/(activa|pasos|peso)=/.test(location.search)){
  const r=parseSalud(decodeURIComponent(location.search.slice(1)));
  if(r){ applySalud(r); persist(); calFecha=r.fecha; startTab="calorias"; setTimeout(()=>toast("Datos de Salud importados"),400); }
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
}
showTab(startTab);
if(NUBE_OK&&window.supabase){ if(!haySesionGuardada()) abrirLogin("entrar"); }
else if(!D.onboarded) abrirWizard();
initNube();
if(rutinaMigrada&&D.sesiones.length) setTimeout(()=>toast("Rutina nueva cargada. Tus entrenos anteriores siguen en Historial y Progreso."),600);
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
